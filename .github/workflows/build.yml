name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www && cp index.html www/
          npm i chess.js@0.10.3
          if [ -f node_modules/chess.js/chess.js ]; then cp node_modules/chess.js/chess.js www/chess.js && sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js#chess.js#' www/index.html; fi
          npx cap init "Apex Chess" com.hara.apexchess --web-dir www
          npx cap add android
          sed -i "s/android:name=\".MainActivity\"/& android:screenOrientation=\"sensorLandscape\"/" android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ApexChess-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Apex Chess ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
